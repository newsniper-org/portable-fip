# Fixture for tools/fip-prelint/tests/fixtures.rs: the driver-checked
# `fip_fn!(prelint, N, ..)` (docs/decisions/2026-11-03-fip-fn-driver-mode.md). `checked`
# is checked; `user` depends on `drvdep`, a non-member declaring `fip::export`, which
# the driver compiles without checking it, so its construction must not compile.
[workspace]
resolver = "3"
members = ["checked", "user"]
exclude = ["drvdep"]
