# Applied to every crate, members and non-members alike. The driver adds the rest
# (`-Zalways-encode-mir`, ...) to members only; it skips flags already present.
[build]
rustflags = [
    "--cfg", "fip_prelint",
    "--check-cfg", "cfg(fip_prelint)",
    "-Zcrate-attr=feature(register_tool)",
    "-Zcrate-attr=feature(custom_inner_attributes)",
    "-Zcrate-attr=register_tool(fip)",
    "-Aunused_features",
]
