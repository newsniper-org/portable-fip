# Applied to every crate, members and non-members alike. The driver adds the rest
# (`-Zalways-encode-mir`, ...) to the crates it takes part in; it skips flags already
# present. `fip::export` is injected here, so it is not visible in any source file.
[build]
rustflags = [
    "--cfg", "fip_prelint",
    "--check-cfg", "cfg(fip_prelint)",
    "-Zcrate-attr=feature(register_tool)",
    "-Zcrate-attr=feature(custom_inner_attributes)",
    "-Zcrate-attr=register_tool(fip)",
    "-Zcrate-attr=fip::export",
    "-Aunused_features",
]
