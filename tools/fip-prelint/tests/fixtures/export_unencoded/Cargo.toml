# Fixture for tools/fip-prelint/tests/fixtures.rs: defence in depth. A dependency
# whose `fip::export` is active although it was compiled without
# `-Zalways-encode-mir`. Through `cargo fip-prelint` alone this cannot happen (a
# dependency declaring `fip::export` in its source is compiled with the driver's
# flags), so the fixture injects the attribute from RUSTFLAGS
# (`-Zcrate-attr=fip::export`) into a non-member whose source does not declare it:
# the driver passes it through to the real rustc, and it ends up claiming export
# without MIR.
[workspace]
resolver = "3"
members = ["app"]
exclude = ["dep_unencoded"]
