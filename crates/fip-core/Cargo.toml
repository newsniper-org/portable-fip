[package]
name = "fip-core"
description = "Allocation-free, in-place building blocks (no_std, no alloc, workspace deps only), verified with Verus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
fip-strict = { path = "../fip-strict" }
fip-macros = { path = "../fip-macros" }

[dev-dependencies]
fip-testkit = { path = "../fip-testkit" }

[lints]
workspace = true

# Verus sidecar of verified bodies (top plan T13.4): regenerated by `just verify-core`,
# which fails if this committed file differs; `fip-prelint` discharges the body-local
# panic sites of the listed functions while their item text and sources match.
[package.metadata.fip-prelint]
verus-sidecar = "verus-verified.txt"
