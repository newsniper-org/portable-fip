# Verus sidecar (top plan T13.4): regenerated by `just verify-strict`, which fails if
# this committed file differs. Every verified method of this crate is a Verus-only
# twin (inside `#[cfg(verus_keep_ghost)]`) or macro-generated, so none is listed.
[package.metadata.fip-prelint]
verus-sidecar = "verus-verified.txt"
