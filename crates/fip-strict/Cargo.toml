# Verus sidecar (top plan T13.4): regenerated by `just verify-strict`, which fails if
# this committed file differs. It lists 2 functions, `Certified::assume` and
# `Certified::assume_no_panic_macros` (`{impl}::..`); every other verified method is a
# Verus-only twin (inside `#[cfg(verus_keep_ghost)]`) or macro-generated, and is
# skipped.
[package.metadata.fip-prelint]
verus-sidecar = "verus-verified.txt"
