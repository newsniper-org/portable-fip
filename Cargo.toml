[workspace]
resolver = "3"
members = [
    "crates/fip-core",
    "crates/fip-lint-rules",
    "crates/fip-strict",
    "crates/fip-alloc",
    "crates/fip-arch",
    "crates/fip-macros",
    "crates/fip-testkit",
]
# `fip-prelint` is a rustc driver on a pinned toolchain, built on its own.
exclude = ["tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
authors = ["윤병익 (BYUNG-IK YEUN) <yeun0908@gmail.com>"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# `verus_keep_ghost` is set by the `verus` driver, `fip_prelint` by the `fip-prelint`
# driver (tools/fip-prelint); plain cargo builds never see either.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(verus_keep_ghost)",
    "cfg(fip_cache_line, values(none(), \"32\", \"64\", \"128\"))",
    "cfg(fip_prelint)",
] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = 1
